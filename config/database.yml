# SQLite for development and test, and for running RAILS_ENV=production on a laptop.
# In the cluster, production is Postgres -- see the production block below.
#
#   gem install sqlite3
#
sqlite: &sqlite
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *sqlite
  database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *sqlite
  database: storage/test.sqlite3

production:
  # In the cluster the deploy injects DATABASE_URL (scheme + host + query) alongside
  # DATABASE_NAME / DATABASE_USER / DATABASE_PASSWORD. Rails merges DATABASE_URL over this
  # hash by itself, as the last step of building the config, so the host and query params
  # arrive on their own -- this branch supplies only what the URL does not carry.
  # Without DATABASE_URL this is plain local SQLite, so the environment boots on a laptop.
<% if AppConfig.database_configured? %>
  adapter: postgresql
  database: <%= AppConfig.database_name %>
  username: <%= AppConfig.database_user %>
  password: <%= AppConfig.database_password %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
<% else %>
  <<: *sqlite
  database: storage/production.sqlite3
<% end %>
