                note: "Een onderdeel dat is gemarkeerd als automatisch wordt ingevuld door de automatische controles die op een inzending draaien; een nakijker kan het daarna nog aanpassen. Een onderdeel dat een voldoende/onvoldoende is, telt bij een voldoende voor de volle punten en bij een onvoldoende als 0."

