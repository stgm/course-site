                graded: "graded"
                grade: "grade"
                grader: "grader"
                subgrades: "parts"
        announcements:
            none: "No announcements."
        final_grades:
            title: "Grade calculation"
            intro: "A final grade is built up in three steps. Every assignment gets a grade, assignments are combined into components, and the components are combined into the final grade. This document describes all calculations, as they were configured at the time of export."
            none: "No final grade is calculated automatically for this schedule."
            heading: "Final grade calculation: %{name}"
            weighted_average: "This grade is the weighted average of the components below, where the weight is the number of points the component contributes."
            all_components_passed: "This grade is a pass or a fail, and is only a pass when every component below has been passed. Nothing is weighed."
            single_component: "This grade consists of a single component, described below, which therefore counts for the whole."
            same_as: "This grade is calculated in exactly the same way as %{name}: the same components, with the same weights, described above."
            compared_to: "Components as compared to %{name}: %{differences}."
            not_repeated:
                one: "The component %{names} is the same as above and is not repeated here."
                other: "The components %{names} are the same as above and are not repeated here."
            component_heading: "Component: %{name}"
            component_is: "The grade for this component is %{strategy}."
            component_is_single: "The grade for this component is determined entirely by %{name}."
            component_undefined: "Component %{name} is used but not defined."
            bonus_label: "%{name} (bonus)"
            header:
                component: "component"
                weight: "weight"
                share: "share"
                condition: "requirement"
                assignment: "assignment"
                points: "points"
                type: "type"
                parts: "parts of the grade"
                formula: "formula"
            strategy:
                points:
                    one: "points earned divided by the single point available, converted to 1--10"
                    other: "points earned divided by the maximum of %{count}, converted to 1--10"
                maximum: "the highest of the assignment grades"
                average: "the weighted average of the assignment grades"
                pass_all:
                    one: "a pass, when the assignment below has been passed"
                    other: "a pass, when all %{count} assignments below have been passed"
                pass_any:
                    one: "a pass, when the assignment below has been passed"
                    other: "a pass, when any one of the %{count} assignments below has been passed"
                pass_first:
                    one: "a pass, when the attempt below has been passed"
                    other: "a pass, when the first of the %{count} attempts below that the student made has been passed"
                pass_last: "a pass, when the most recent attempt the student made after the first one has been passed"
            condition:
                none: "-"
                minimum: "at least %{minimum}"
                passed: "passed"
                required: "no assignment graded 0"
                attempt_required:
                    one: "attempted and submitted"
                    other: "all assignments attempted"
                zero_weight_required: "one or more assignments are required to receive a course grade"
                pass_all:
                    one: "the assignment passed"
                    other: "all %{count} assignments passed"
                pass_any:
                    one: "the assignment passed"
                    other: "one of the %{count} assignments passed"
                pass_first: "the first attempt passed"
                pass_last: "the resit attempt passed"
            difference:
                used_instead: "%{name} (weight %{weight}) is added"
                added: "%{name} is added"
                not_used: "%{name} is removed"
                other_weight: "%{name} counts for %{weight} instead of %{previous}"
            rule:
                single_pass: "This component counts as a 10 when %{name} has been passed, and as a 1 otherwise."
                single_pass_required: "This component counts as a 10 when %{name} has been passed, and as a NAV otherwise."
                single_points:
                    one: "The result for %{name} is converted to a grade from 1 to 10, where %{count} point makes a 10."
                    other: "The result for %{name} is converted to a grade from 1 to 10, where %{count} points make a 10."
                minimum: "A grade of %{minimum} or higher is required; below that the final grade becomes NAV."
                maximum: "At most %{maximum} points count towards this component, any more are not counted."
                attempt_required:
                    one: "The assignment must have been attempted and submitted; if it is missing, the final grade is not calculated."
                    other: "All assignments must have been attempted; if any is missing, the final grade is not calculated."
                missing_cancels: "If the grade for any assignment is missing, the final grade is not calculated."
                missing_scores_zero:
                    one: "If the assignment was not made at all, it scores 0 points."
                    other: "An assignment that is missing scores 0 points."
                missing_counts_as: "An assignment that is missing counts as the grade %{value}."
                missing_allowed: "An assignment that is missing does not block the calculation."
                missing_undecided: "An assignment that has not been graded yet leaves this component undecided, and the final grade is not calculated. An assignment that has been failed makes the final grade a fail."
                missing_undecided_any: "As long as none of the assignments has been graded, this component is undecided and the final grade is not calculated. Once one of them has been graded and none has been passed, the final grade is a fail."
                attempt_not_made: "The attempts are counted in the order listed above, and the first one the student made determines this component. As long as no attempt has been made, no grade is registered at all."
                resit_not_made: "This is the resit registration: the most recent attempt the student made after the first one determines it, and an attempt in between is overwritten, which is recorded in the notes on the grade. As long as no second attempt has been made, no grade is registered at all."
                required: "Any assignment graded 0 makes the final grade NAV."
                drop_lowest: "The lowest assignment grade is dropped."
                bonus: "Bonus assignments are added on top, up to a maximum grade of 10."
                zero_weight_required: "An assignment with weight 0 is required: without a grade for it, this component becomes a NAV."
                deadline: "Deadline: %{deadline}."
            rounding:
                title: "Rounding"
                intro: "The calculated final grade is rounded following the university rules:"
                rules:
                    - "grades from 4.75 up to (but not including) 5.5 become 5"
                    - "grades from 5.5 up to (but not including) 6.25 become 6"
                    - "all other grades are rounded to the nearest half point"
                    - "anything above 10 becomes 10"
                note: "If a component could not be determined, that final grade is not registered; other final grades that do not use the component are still calculated. If a required condition was not met, the final grade is NAV."
            assignments:
                title: "How each assignment is graded"
                intro: "Graders enter the parts listed under 'parts of the grade'. The formula shows how those parts are combined into the grade for the assignment. Where no formula is given, the grader enters the grade directly."
                automatic: "%{name} (automatic)"
                note: "A part marked as automatic is filled in by the automatic checks that run on a submission; a grader can still change it. A part that is a pass/fail counts as full points when passed and as 0 when failed."

